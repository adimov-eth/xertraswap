name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set environment
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "REACT_APP_CHAIN_ID=105105" >> "$GITHUB_ENV"
            echo "REACT_APP_WEB3AUTH_NETWORK=sapphire_mainnet" >> "$GITHUB_ENV"
            echo "REACT_APP_WEB3AUTH_CLIENT_ID=${{ secrets.WEB3AUTH_CLIENT_ID_PROD }}" >> "$GITHUB_ENV"
          else
            echo "REACT_APP_CHAIN_ID=205205" >> "$GITHUB_ENV"
            echo "REACT_APP_WEB3AUTH_NETWORK=sapphire_devnet" >> "$GITHUB_ENV"
            echo "REACT_APP_WEB3AUTH_CLIENT_ID=${{ secrets.WEB3AUTH_CLIENT_ID_DEV }}" >> "$GITHUB_ENV"
          fi

      - name: Build SDK
        run: yarn workspace @xertra/sdk build

      - name: Build interface
        run: yarn workspace @xertra/interface build
        env:
          GENERATE_SOURCEMAP: false

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy interface/build --project-name=xertraswap --branch=${{ github.ref_name }}

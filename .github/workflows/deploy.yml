name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy production (mainnet)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build SDK
        run: yarn workspace @xertra/sdk build

      - name: Build interface
        run: yarn workspace @xertra/interface build
        env:
          GENERATE_SOURCEMAP: false
          REACT_APP_CHAIN_ID: "105105"
          REACT_APP_WEB3AUTH_NETWORK: sapphire_mainnet
          REACT_APP_WEB3AUTH_CLIENT_ID: ${{ secrets.WEB3AUTH_CLIENT_ID_PROD }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy interface/build --project-name=xertraswap --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy dev (testnet)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build SDK
        run: yarn workspace @xertra/sdk build

      - name: Build interface
        run: yarn workspace @xertra/interface build
        env:
          GENERATE_SOURCEMAP: false
          REACT_APP_CHAIN_ID: "205205"
          REACT_APP_WEB3AUTH_NETWORK: sapphire_devnet
          REACT_APP_WEB3AUTH_CLIENT_ID: ${{ secrets.WEB3AUTH_CLIENT_ID_DEV }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy interface/build --project-name=xertraswap-testnet --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

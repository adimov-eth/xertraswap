name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    strategy:
      matrix:
        network:
          - name: mainnet
            chain_id: "105105"
            web3auth_network: sapphire_mainnet
            web3auth_secret: WEB3AUTH_CLIENT_ID_PROD
            pages_project: xertraswap
          - name: testnet
            chain_id: "205205"
            web3auth_network: sapphire_devnet
            web3auth_secret: WEB3AUTH_CLIENT_ID_DEV
            pages_project: xertraswap-testnet

    name: Deploy ${{ matrix.network.name }} (${{ github.ref_name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build SDK
        run: yarn workspace @xertra/sdk build

      - name: Build interface
        run: yarn workspace @xertra/interface build
        env:
          GENERATE_SOURCEMAP: false
          REACT_APP_CHAIN_ID: ${{ matrix.network.chain_id }}
          REACT_APP_WEB3AUTH_NETWORK: ${{ matrix.network.web3auth_network }}
          REACT_APP_WEB3AUTH_CLIENT_ID: ${{ secrets[matrix.network.web3auth_secret] }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy interface/build --project-name=${{ matrix.network.pages_project }} --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

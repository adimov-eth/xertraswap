name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set environment
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "REACT_APP_CHAIN_ID=105105" >> "$GITHUB_ENV"
            echo "REACT_APP_WEB3AUTH_NETWORK=sapphire_mainnet" >> "$GITHUB_ENV"
            echo "REACT_APP_WEB3AUTH_CLIENT_ID=${{ secrets.WEB3AUTH_CLIENT_ID_PROD }}" >> "$GITHUB_ENV"
          else
            echo "REACT_APP_CHAIN_ID=205205" >> "$GITHUB_ENV"
            echo "REACT_APP_WEB3AUTH_NETWORK=sapphire_devnet" >> "$GITHUB_ENV"
            echo "REACT_APP_WEB3AUTH_CLIENT_ID=${{ secrets.WEB3AUTH_CLIENT_ID_DEV }}" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: yarn workspace @xertra/interface build
        env:
          GENERATE_SOURCEMAP: false

      - name: Deploy to Cloudflare Pages
        env:
          CF_REFRESH_TOKEN: ${{ secrets.CLOUDFLARE_REFRESH_TOKEN }}
        run: |
          CFG_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/.wrangler/config"
          mkdir -p "$CFG_DIR"
          printf 'oauth_token = ""\nrefresh_token = "%s"\nexpiration_time = "2000-01-01T00:00:00.000Z"\nscopes = ["account:read", "user:read", "pages:write", "offline_access"]\n' "$CF_REFRESH_TOKEN" > "$CFG_DIR/default.toml"
          npx wrangler pages deploy interface/build --project-name=xertraswap --branch=${{ github.ref_name }}
